[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-freight-fde"
version = "0.1.0"
description = "Deterministic, PII-safe breakdown-to-resolution MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx2>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
